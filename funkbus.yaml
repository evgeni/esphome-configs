esphome:
  name: funkbus

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

<<: !include _funkbus.yaml

esp32_ble_tracker:
  scan_parameters:
    # We currently use the defaults to ensure Bluetooth
    # can co-exist with WiFi In the future we may be able to
    # enable the built-in coexistence logic in ESP-IDF
    active: true

bluetooth_proxy:
  active: true
