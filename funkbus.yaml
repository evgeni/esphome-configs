esphome:
  name: funkbus
  libraries:
    - EEPROM
    - SPI
    - SmartRC-CC1101-Driver-Lib@2.5.7

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret fallback_ssid
    password: !secret fallback_password

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

light:
  - platform: funkbus
    name: "Test Funkbus"
    serial: !secret funkbus_serial
    switch: 1
    pin: GPIO2
