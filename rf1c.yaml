esphome:
  name: rf1c
  friendly_name: RF1C

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: None

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret fallback_ssid
    password: !secret fallback_password

captive_portal:

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

preferences:
  flash_write_interval: 6h

web_server:
  port: 80

globals:
  - id: pulses
    type: int
    restore_value: yes
    initial_value: "0"

binary_sensor:
  - platform: gpio
    id: pulse
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
    name: Pulse
    filters:
      - delayed_on_off: 100ms
    on_press:
      then:
        - lambda: id(pulses) += 1;

sensor:
  - platform: template
    name: Gas
    device_class: gas
    unit_of_measurement: "m³"
    state_class: total_increasing
    icon: "mdi:fire"
    accuracy_decimals: 3
    lambda: return id(pulses) * 0.01;
    update_interval: 60s
  - platform: homeassistant
    name: Offset Gas
    entity_id: sensor.meter_rf1c_offset
    id: offset
    on_value:
      then:
        - globals.set:
            id: pulses
            value: !lambda 'return int(x);'

  - platform: uptime
    name: Uptime Sensor

  - platform: wifi_signal
    name: "WiFi Signal Sensor"

  - platform: internal_temperature
    name: "Internal Temperature"

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    hide_hash: true
