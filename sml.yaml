esphome:
  name: sml
  friendly_name: SML

esp32:
  board: nodemcu-32s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: None

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret fallback_ssid
    password: !secret fallback_password

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

sensor:
  - platform: uptime
    name: Uptime Sensor

  - platform: wifi_signal
    name: "WiFi Signal Sensor"

  - platform: internal_temperature
    name: "Internal Temperature"

  - platform: sml
    name: "Total energy"
    obis_code: "1-0:1.8.0"
    unit_of_measurement: kWh
    accuracy_decimals: 1
    device_class: energy
    state_class: total_increasing

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  rx_buffer_size: 2048

sml:
  uart_id: uart_bus

# https://www.rng.de/bedienungsanleitung-apator-norax3d.pdfx
# https://www.rng.de/bedienungsanleitung-apator-norax3d-2.2.pdfx
#   (0a01234567890abcdef0) 1-0:96.50.1 [0x415041]                   - Identifizierung des Herstellers
#   (0a01234567890abcdef0) 1-0:96.1.0 [0x0a01234567890abcdef0]      - Identifizierung des Geräts gem. der Norm DIN 43863-5
#   (0a01234567890abcdef0) 1-0:1.8.0 [0x000000000000623f]           - Register der A+ -Energie summarisch Wh * 10-3
