esphome:
  name: somfy
  friendly_name: Somfy
  libraries:
    - EEPROM
    - SPI
    - SmartRC-CC1101-Driver-Lib@2.5.7
    - Somfy_Remote_Lib@0.4.1

esp32:
  board: nodemcu-32s

external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: !secret fallback_ssid
    password: !secret fallback_password

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

sensor:
  - platform: uptime
    name: Uptime Sensor

  - platform: wifi_signal
    name: "WiFi Signal Sensor"

  - platform: internal_temperature
    name: "Internal Temperature"

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true

light:
  - platform: funkbus
    serial: !secret funkbus_serial
    switch: 0
    name: "Wohnzimmer - Sofa"
    pin:
      number: GPIO2
      allow_other_uses: true
  - platform: funkbus
    serial: !secret funkbus_serial
    switch: 1
    name: "Wohnzimmer - TV"
    pin:
      number: GPIO2
      allow_other_uses: true

cover:
  - platform: somfy
    name: Badezimmer
    id: badezimmer
    storage_key: badezimmer
    repeat: 6
    remote_address: !secret somfy_address_badezimmer
    pin:
      number: GPIO2
      allow_other_uses: true

  - platform: somfy
    name: Kinderzimmer
    id: kinderzimmer
    storage_key: kinderzimmer
    repeat: 6
    remote_address: !secret somfy_address_kinderzimmer
    pin:
      number: GPIO2
      allow_other_uses: true

  - platform: somfy
    name: Bedroom
    id: bedroom
    storage_key: bedroom
    repeat: 6
    remote_address: !secret somfy_address_bedroom
    pin:
      number: GPIO2
      allow_other_uses: true

button:
  - platform: template
    name: "PROG Badezimmer"
    on_press:
      - lambda: |-
          id(badezimmer)->program();
  - platform: template
    name: "PROG Kinderzimmer"
    on_press:
      - lambda: |-
          id(kinderzimmer)->program();
  - platform: template
    name: "PROG Bedroom"
    on_press:
      - lambda: |-
          id(bedroom)->program();
